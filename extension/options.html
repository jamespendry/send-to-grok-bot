<!doctype html><html><head><meta charset="utf-8"><title>Send to Grok Bot</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 20px;color:#0f1419;font-size:14px}
h1{font-size:20px;margin:0 0 4px}p{color:#536471;margin:0 0 8px;line-height:1.4}
.dest{padding:14px 0;border-top:1px solid #eff3f4}
.dest:first-of-type{border-top:0}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:700;cursor:pointer}
.check input{width:16px;height:16px;margin:2px 0 0;flex:none}
.fields{margin:10px 0 0 26px}
.fields[hidden]{display:none}
label.field{display:block;font-weight:600;margin:12px 0 6px}
label.field:first-child{margin-top:0}
input[type="url"],input[type="password"],input[type="text"],textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd9de;border-radius:6px;font:inherit}
textarea{height:140px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#1d9bf0}
.hint{font-weight:400;color:#536471;font-size:13px;margin-top:4px;line-height:1.4}
button{margin-top:8px;padding:9px 18px;border:0;border-radius:9999px;background:#0f1419;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#m{margin-left:12px;color:#00ba7c}
</style></head><body>
<h1>Send to Grok Bot</h1>
<p>Choose where posts go when you click the button. You can turn on more than one. Nothing else is sent.</p>

<div class="dest">
  <label class="check"><input type="checkbox" data-dest="grokbot"> Grok Bot / webhook</label>
  <div class="fields" data-for="grokbot" hidden>
    <label class="field" for="u">Webhook URL</label><input id="u" type="url" placeholder="https://...">
    <label class="field" for="k">Webhook key (optional)</label><input id="k" type="password" placeholder="Sent as a Bearer token" autocomplete="off">
  </div>
</div>

<div class="dest">
  <label class="check"><input type="checkbox" data-dest="claude_routine"> Claude Code routine (automatic)</label>
  <div class="fields" data-for="claude_routine" hidden>
    <label class="field" for="cu">Routine URL<div class="hint">From claude.ai/code/routines: edit the routine, Add another trigger, API. A bare trig_ ID also works.</div></label>
    <input id="cu" type="text" placeholder="https://api.anthropic.com/v1/claude_code/routines/trig_.../fire" autocomplete="off">
    <label class="field" for="ct">Routine token</label><input id="ct" type="password" placeholder="sk-ant-oat01-..." autocomplete="off">
    <label class="field" for="cp">Extra instructions (optional)<div class="hint">The routine's saved prompt does the work. This text is prepended to the post. Shared with Open in Claude.</div></label>
    <textarea id="cp" data-sync="claudePrompt"></textarea>
  </div>
</div>

<div class="dest">
  <label class="check"><input type="checkbox" data-dest="claude_link"> Open in Claude</label>
  <div class="fields" data-for="claude_link" hidden>
    <label class="field" for="cp2">Claude prompt<div class="hint">Leave blank for the default. The post is added after it, and you press Send in Claude. Shared with the Claude routine.</div></label>
    <textarea id="cp2" data-sync="claudePrompt"></textarea>
  </div>
</div>

<div class="dest">
  <label class="check"><input type="checkbox" data-dest="chatgpt_link"> Open in ChatGPT</label>
  <div class="fields" data-for="chatgpt_link" hidden>
    <label class="field" for="gp">Research prompt<div class="hint">Leave blank for the default. The post link and text are added after it. Shared with the Workspace Agent.</div></label>
    <textarea id="gp" data-sync="chatgptPrompt"></textarea>
  </div>
</div>

<div class="dest">
  <label class="check"><input type="checkbox" data-dest="chatgpt_workspace_agent"> ChatGPT Workspace Agent</label>
  <div class="fields" data-for="chatgpt_workspace_agent" hidden>
    <label class="field" for="ti">API trigger ID</label><input id="ti" type="text" placeholder="agtch_..." autocomplete="off">
    <label class="field" for="tt">Workspace Agent access token</label><input id="tt" type="password" placeholder="Sent as a Bearer token to api.chatgpt.com" autocomplete="off">
    <label class="field" for="gp2">Research prompt<div class="hint">Leave blank for the default. Shared with Open in ChatGPT.</div></label>
    <textarea id="gp2" data-sync="chatgptPrompt"></textarea>
  </div>
</div>

<button id="s">Save</button><span id="m"></span>
<script src="options.js"></script></body></html>
