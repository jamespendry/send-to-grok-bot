<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send to Grok Bot</title>
<style>
  html, body {
    margin: 0;
    width: 1400px;
    height: 560px;
    overflow: hidden;
    background: #0f1419;
    color: #fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Liberation Sans", Helvetica, Arial, sans-serif;
  }
  body {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 88px;
    padding: 0 72px;
  }
  .copy { width: 640px; }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #1d9bf0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 22px 0 0;
    font-size: 64px;
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .sub {
    margin: 16px 0 0;
    font-size: 26px;
    line-height: 1.35;
    font-weight: 400;
    color: #e7eef4;
  }
  .fine {
    margin: 10px 0 0;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 400;
    color: #9aa8b4;
  }
  .card {
    width: 420px;
    box-sizing: border-box;
    background: #000;
    border: 1px solid #2f3336;
    border-radius: 20px;
    padding: 22px 18px 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 8px 16px;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #38444d;
  }
  .dot.on {
    width: 34px;
    height: 34px;
    margin-left: auto;
    background: rgba(29, 155, 240, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu {
    background: #16181c;
    border: 1px solid #2f3336;
    border-radius: 16px;
    overflow: hidden;
    padding: 6px 0;
  }
  .row {
    display: flex;
    align-items: center;
    height: 52px;
    padding: 0 18px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #e7e9ea;
  }
  .row.on {
    background: rgba(29, 155, 240, 0.12);
    color: #1d9bf0;
    box-shadow: inset 3px 0 0 #1d9bf0;
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <path fill="#ffffff" d="M4.5 12.8h10.1l-4.2 4.2 1.6 1.6 6.6-6.6-6.6-6.6-1.6 1.6 4.2 4.2H4.5v2.6z"/>
      </svg>
    </div>
    <h1>Send to Grok Bot</h1>
    <p class="sub">Send the post you choose.</p>
    <p class="fine">Grok Bot, Claude, ChatGPT, or Codex. Only that post. Only the destination you set up.</p>
  </div>
  <div class="card" aria-hidden="true">
    <div class="bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot on">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#1d9bf0" d="M4.5 12.8h10.1l-4.2 4.2 1.6 1.6 6.6-6.6-6.6-6.6-1.6 1.6 4.2 4.2H4.5v2.6z"/>
        </svg>
      </span>
    </div>
    <div class="menu">
      <div class="row on">Send to Grok Bot</div>
      <div class="row">Send to Claude</div>
      <div class="row">Send to ChatGPT</div>
      <div class="row">Send to Codex</div>
    </div>
  </div>
</body>
</html>
